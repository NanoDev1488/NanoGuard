[package]
name = "nanoguard-fastscan"
version = "1.0.0"
edition = "2021"
authors = ["NanoDev <t.me/WineSquad>"]
description = "Ultra-fast parallel bytecode security auditor and backdoor hunter for Minecraft/Java plugins"

[dependencies]
rayon = "1.10.0"
memmap2 = "0.9.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
