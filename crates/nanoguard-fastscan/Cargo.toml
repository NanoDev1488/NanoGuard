[package]
name = "nanoguard-fastscan"
version = "1.0.0"
edition = "2021"
authors = ["NanoDev <t.me/WineSquad>"]
description = "Ultra-fast parallel bytecode security auditor and backdoor hunter for Minecraft/Java plugins"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
memmap2 = "0.9"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "nanoguard-fastscan"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
